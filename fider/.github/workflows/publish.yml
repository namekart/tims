name: publish

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Dump GitHub context
        run: echo "$GITHUB_CONTEXT"
        env:
          GITHUB_CONTEXT: ${{ toJSON(github) }}

      - name: Checkout
        uses: actions/checkout@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: build and push docker image (pull_request)
        if: ${{ github.event_name == 'pull_request' }}
        uses: docker/build-push-action@v3
        with:
          push: true
          context: .
          build-args: COMMITHASH=${{ github.sha }}
          platforms: linux/amd64
          tags: getfider/fider:PR_${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: build and push docker image (push branch)
        if: ${{ github.event_name == 'push' }}
        uses: docker/build-push-action@v3
        with:
          push: true
          context: .
          build-args: COMMITHASH=${{ github.sha }}
          platforms: linux/amd64,linux/arm64/v8
          tags: |
            getfider/fider:SHA_${{ github.sha }}
            getfider/fider:${{ github.ref_name == 'main' && 'main' || 'stable' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: build and push docker image (push tag)
        if: ${{ github.event_name == 'release' }}
        uses: docker/build-push-action@v3
        with:
          push: true
          context: .
          build-args: |
            COMMITHASH=${{ github.sha }}
            VERSION=${{ github.event.release.tag_name }}
          platforms: linux/amd64,linux/arm64/v8
          tags: getfider/fider:${{ github.event.release.tag_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
